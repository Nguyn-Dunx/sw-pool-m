name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'FE-glm/**'
      - '.github/workflows/fe-ci.yml'
      - '.github/workflows/fe-ci.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'FE-glm/**'
      - '.github/workflows/fe-ci.yml'
      - '.github/workflows/fe-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: ./FE-glm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './FE-glm/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        if: matrix.node-version == '22.x' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./FE-glm/dist/
          retention-days: 7
