<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0284C7" />
    <title>Pool Manager — Quản lý bể bơi</title>
    <meta name="description" content="Hệ thống quản lý bể bơi: học viên, giáo viên, khóa học, điểm danh, học phí." />
    <script>
      // Áp theme trước khi paint để tránh chớp sáng/tối
      try {
        if (localStorage.getItem('pool-theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1120')
        }
      } catch (e) { /* localStorage bị chặn — giữ theme sáng */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
